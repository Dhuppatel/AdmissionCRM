spring:
  application:
    name: lead-service

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASS}
    from: ${MAIL_USERNAME}

server:
  port: ${PORT:8083}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

sendgrid:
  api-key: ${SENDGRID_API_KEY}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  phone-number: ${TWILIO_PHONE_NUMBER}
  whatsapp-number: ${TWILIO_WHATSAPP_NUMBER}
  lead:
    creation_acknowledgement: ${template_lead_creation_acknowledgement}
    assignment_notification: ${template_lead_assignment_notification}

eureka:
  client:
    enabled: true
  instance:
    prefer-ip-address: true

env:
  path: ${ENV_PATH}