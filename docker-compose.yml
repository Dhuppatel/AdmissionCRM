version: "3.9"

services:

  eureka-server:
    build: ./eureka_server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - admissioncrm-net

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - admissioncrm-net

  auth-service:
    build: ./authentication-service
    container_name: auth-service
    ports:
      - "6002:6002"
    depends_on:
      - eureka-server
    env_file:
      - ./authentication-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - admissioncrm-net

  lead-service:
    build: ./lead-management
    container_name: lead-service
    ports:
      - "6001:6001"
    depends_on:
      - eureka-server
    env_file:
      - ./lead-management/.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - admissioncrm-net

  application-service:
    build: ./ApplicationMgmt-Service
    container_name: application-service
    ports:
      - "8001:8001"
    depends_on:
      - eureka-server
    env_file:
      - ./ApplicationMgmt-Service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - admissioncrm-net

networks:
  admissioncrm-net:
    driver: bridge
