server:
  port: 8080

spring:
  application:
    name: api-gateway

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:1f1dada12ecf13b34cba99d384dc943dfbcbcdb25e6e21fbd37aeedffbcf1c88}
  expiration: ${JWT_EXPIRATION:86400}
  header: Authorization
  prefix: Bearer

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.admissioncrm.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG

# Common eureka behavior
eureka:
  client:
    enabled: true
  instance:
    prefer-ip-address: true